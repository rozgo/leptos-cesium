<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leptos Cesium – Pinned Video Material</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Cesium.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
      }

      .overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        max-width: 420px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(10, 16, 28, 0.8);
        color: #dce5ff;
        font-family: sans-serif;
      }

      .overlay small {
        color: #9cb0de;
      }

      .overlay .error {
        margin-top: 8px;
        color: #ffb6b6;
      }
    </style>
  </head>
  <body>
    <link data-trunk rel="rust" data-bindgen-target="web" data-wasm-opt="z" />
  </body>
</html>
