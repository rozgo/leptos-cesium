<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leptos Cesium - Camera Control</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Cesium.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d111c;
        color: #eef2ff;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .panel {
        padding: 14px;
        min-height: 0;
        overflow-y: auto;
        border-right: 1px solid #1f2535;
        background: linear-gradient(180deg, #0f1527, #0b101d);
      }

      .panel h2 {
        margin: 0 0 12px;
      }

      .panel h3 {
        margin: 14px 0 8px;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .group button {
        border: 1px solid #334165;
        background: #19223b;
        color: #f2f5ff;
        padding: 7px 9px;
        border-radius: 8px;
        cursor: pointer;
      }

      .group button:hover {
        background: #233157;
      }

      .toggles {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .toggles label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .viewer-wrap {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }

        .panel {
          border-right: 0;
          border-bottom: 1px solid #1f2535;
          max-height: 42vh;
        }
      }
    </style>
  </head>
  <body>
    <link data-trunk rel="rust" data-bindgen-target="web" data-wasm-opt="z" />
  </body>
</html>
