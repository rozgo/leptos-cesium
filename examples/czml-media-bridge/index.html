<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leptos Cesium – CZML Media Bridge</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" />
    <link data-trunk rel="copy-file" href="public/pin.svg" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
      }

      .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        min-width: 300px;
        max-width: 420px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(11, 16, 32, 0.82);
        color: #deebff;
        font-family: sans-serif;
      }

      .panel button {
        margin-top: 8px;
        border: 0;
        border-radius: 6px;
        padding: 6px 10px;
        color: #f6fbff;
        background: #255dc6;
        cursor: pointer;
      }

      .panel .status {
        margin-top: 8px;
        color: #9cc7ff;
      }

      .panel .error {
        margin-top: 8px;
        color: #ffb8c4;
      }

    </style>
  </head>
  <body>
    <link data-trunk rel="rust" data-bindgen-target="web" data-wasm-opt="z" />
  </body>
</html>
