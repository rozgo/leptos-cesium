<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leptos Cesium - CZML Streaming</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0c1118;
        color: #d9e3ef;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
        overflow: hidden;
      }

      .controls {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        width: min(420px, calc(100vw - 24px));
        background: rgba(10, 16, 24, 0.92);
        border: 1px solid rgba(90, 120, 150, 0.55);
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      }

      .controls h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }

      .controls .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      .controls .stats {
        font-size: 12px;
        line-height: 1.45;
        color: #c2d0df;
      }

      .controls button {
        background: #172537;
        color: #e4edf8;
        border: 1px solid #4a6a89;
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }

      .controls button:hover {
        background: #203246;
      }

      .controls button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .controls .error {
        margin-top: 6px;
        color: #ff9da3;
      }
    </style>
  </head>
  <body>
    <link data-trunk rel="rust" data-bindgen-target="web" data-wasm-opt="z" />
  </body>
</html>
